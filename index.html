  <style>
/* Construct Lab · visual system
   Drafting table (cool paper), cyanotype blueprint for the test specification,
   index cards for items (Rust's card method), quiet everywhere else. */

:root {
  --ink: #1d2840;
  --ink-2: #3a4660;
  --muted: #5b6880;
  --paper: #eef2f6;
  --card: #ffffff;
  --rule: #d5dfea;
  --rule-strong: #b7c6d8;
  --cyan: #1e4e86;
  --cyan-deep: #133863;
  --cyan-line: rgba(220, 234, 250, 0.30);
  --orange: #e57200;
  --index-red: #d04a3f;
  --good: #2e7d4f;
  --warn: #a85a06;
  --bad: #b23a3a;
  --good-bg: #e6f3eb;
  --warn-bg: #fdf0e1;
  --bad-bg: #fbe8e8;
  --focus: #e57200;

  /* facet colors: categorical, distinguishable for common color-vision deficiencies,
     never used alone (always paired with a name or letter) */
  --f0: #2a6fb0; /* self-efficacy */
  --f1: #b9861a; /* achievement-striving */
  --f2: #2f8f5f; /* perseverance */
  --f3: #7a58b0; /* introspection */
  --f4: #c94f78; /* aesthetics */
  --f5: #23898c; /* abstract-thinking */

  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --text: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;

  --r-sm: 4px;
  --r-md: 8px;
  --shadow-card: 0 1px 0 rgba(29, 40, 64, 0.06), 0 2px 6px rgba(29, 40, 64, 0.06);
  --maxw: 1240px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--text);
  font-size: 16px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--cyan); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

h1, h2, h3, h4 { font-family: var(--display); line-height: 1.15; margin: 0 0 0.4em; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 4.2vw, 3.1rem); font-weight: 800; font-stretch: 88%; }
h2 { font-size: clamp(1.45rem, 2.4vw, 1.9rem); font-weight: 750; font-stretch: 92%; }
h3 { font-size: 1.15rem; font-weight: 700; }
h4 { font-size: 1rem; font-weight: 700; }
p { margin: 0 0 0.8em; }
.lede { font-size: 1.12rem; color: var(--ink-2); max-width: 68ch; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.nowrap { white-space: nowrap; }

/* ---------------------------------------------------------------- top bar */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--ink);
  color: #fff;
  border-bottom: 3px solid var(--orange);
}
.topbar-inner {
  max-width: var(--maxw); margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
.brand { font-family: var(--display); font-weight: 800; font-stretch: 85%; font-size: 1.15rem; letter-spacing: 0.01em; white-space: nowrap; }
.brand span { color: #f5b26b; font-weight: 600; }
.track { display: flex; gap: 4px; flex: 1 1 auto; list-style: none; margin: 0; padding: 0; min-width: 0; overflow-x: auto; }
.track li { flex: 1 1 0; min-width: 92px; }
.track button {
  width: 100%; text-align: left; background: transparent; border: 0; color: #c7d0e0; cursor: pointer;
  padding: 4px 8px 6px; border-radius: var(--r-sm); font-size: 0.8rem; line-height: 1.2;
  border-top: 3px solid rgba(255, 255, 255, 0.18);
}
.track button b { display: block; font-size: 0.86rem; color: #fff; font-weight: 650; }
.track button[aria-current="step"] { border-top-color: var(--orange); color: #fff; background: rgba(255, 255, 255, 0.07); }
.track button.done { border-top-color: #7fc79c; }
.track button:disabled { cursor: default; opacity: 0.55; }
.clock { font-size: 0.82rem; color: #c7d0e0; white-space: nowrap; text-align: right; }
.clock strong { color: #fff; font-size: 1rem; }
.clock .over { color: #ffb36b; }
.who { font-size: 0.82rem; color: #c7d0e0; white-space: nowrap; }
.who button { background: none; border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: var(--r-sm); padding: 2px 8px; margin-left: 6px; cursor: pointer; font-size: .78rem; }

/* ---------------------------------------------------------------- layout */
main { max-width: var(--maxw); margin: 0 auto; padding: 24px 16px 80px; }
.stage-head { display: grid; grid-template-columns: 1fr auto; gap: 8px 24px; align-items: end; margin-bottom: 18px; }
.stage-head .step { font-family: var(--display); font-weight: 700; color: var(--orange); font-size: 0.95rem; margin-bottom: 2px; }
.stage-head .lede { margin: 0; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.layout.wide { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r-md); padding: 20px; margin-bottom: 20px; }
.panel > h3:first-child, .panel > h2:first-child { margin-top: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.task-n { display: inline-grid; place-items: center; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--ink); color: #fff; font-size: 0.85rem; font-weight: 700; margin-right: 8px; vertical-align: 2px; }

/* ---------------------------------------------------------------- concept boxes */
.notes { position: sticky; top: 92px; max-height: calc(100vh - 110px); overflow: auto; padding-right: 2px; }
@media (max-width: 980px) { .notes { position: static; max-height: none; } }
.concept {
  background: #fff; border: 1px solid var(--rule); border-left: 4px solid var(--cyan);
  border-radius: var(--r-sm); padding: 12px 14px; margin-bottom: 12px; font-size: 0.92rem;
}
.concept h4 { margin: 0 0 4px; font-size: 0.98rem; color: var(--cyan-deep); }
.concept p { margin: 0 0 6px; }
.concept p:last-child { margin-bottom: 0; }
.concept .formula { font-family: var(--serif); font-style: italic; background: #f3f6fa; padding: 6px 8px; border-radius: 3px; margin: 6px 0; font-size: 0.98rem; }
.concept .src { color: var(--muted); font-size: 0.8rem; }
.concept.proc { border-left-color: var(--orange); }
.concept.proc h4 { color: #8a4300; }
.notes-title { font-family: var(--display); font-weight: 700; font-size: 0.95rem; color: var(--muted); margin: 0 0 8px; }

/* ---------------------------------------------------------------- buttons & controls */
.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  min-height: 44px; padding: 10px 18px; border-radius: var(--r-sm); border: 1px solid var(--ink);
  background: var(--ink); color: #fff; font-weight: 650; cursor: pointer; text-decoration: none;
}
.btn:hover { background: #2b3a5c; }
.btn:disabled { background: #9aa6ba; border-color: #9aa6ba; cursor: not-allowed; }
.btn.ghost { background: #fff; color: var(--ink); border-color: var(--rule-strong); }
.btn.ghost:hover { background: #f3f6fa; }
.btn.big { font-size: 1.05rem; padding: 12px 24px; }
.btn.orange { background: var(--orange); border-color: var(--orange); color: #1d1300; }
.btn.orange:hover { background: #f08a24; }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: 0.86rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { justify-content: space-between; }
.next-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 16px; margin-top: 8px; }
.next-bar .why { color: var(--muted); font-size: 0.92rem; max-width: 60ch; }

label.field { display: block; font-weight: 600; margin: 10px 0 4px; }
input[type="text"], input[type="number"], textarea, select {
  width: 100%; border: 1px solid var(--rule-strong); border-radius: var(--r-sm); padding: 10px 12px; background: #fff; min-height: 44px;
}
textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
input[type="number"] { width: 110px; }
.hint { color: var(--muted); font-size: 0.86rem; margin-top: 4px; }

.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.choice {
  position: relative; display: block; border: 1px solid var(--rule-strong); border-radius: var(--r-md);
  padding: 14px 16px; cursor: pointer; background: #fff;
}
.choice input { position: absolute; opacity: 0; }
.choice:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.choice:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.choice .t { font-weight: 700; display: block; margin-bottom: 2px; }
.choice ul { margin: 6px 0 0; padding-left: 18px; font-size: 0.9rem; color: var(--ink-2); }

.feedback { border-radius: var(--r-sm); padding: 10px 12px; margin-top: 10px; font-size: 0.94rem; }
.feedback.ok { background: var(--good-bg); color: #1d5a37; }
.feedback.no { background: var(--bad-bg); color: #8a2525; }
.feedback.note { background: var(--warn-bg); color: #6d3c05; }

.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 0.8rem; font-weight: 600; border: 1px solid currentColor; background: #fff; white-space: nowrap; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }

/* ---------------------------------------------------------------- the blueprint (cyanotype) */
.blueprint {
  background-color: var(--cyan);
  background-image:
    linear-gradient(var(--cyan-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--cyan-line) 1px, transparent 1px),
    linear-gradient(rgba(220, 234, 250, 0.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(220, 234, 250, 0.09) 1px, transparent 1px);
  background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
  color: #eef5ff; border-radius: var(--r-md); padding: 22px; position: relative;
  border: 1px solid var(--cyan-deep);
}
.blueprint h3 { color: #fff; font-stretch: 90%; }
.blueprint .muted, .blueprint .hint { color: #bcd2ec; }
.bp-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.bp-table th, .bp-table td { border: 1.5px solid rgba(238, 245, 255, 0.85); padding: 8px; text-align: center; }
.bp-table thead th { font-weight: 650; font-size: 0.9rem; }
.bp-table thead th small { display: block; font-weight: 400; color: #bcd2ec; font-size: 0.75rem; }
.bp-table tbody th { text-align: left; font-weight: 650; }
.bp-table tbody th small { display: block; font-weight: 400; color: #bcd2ec; font-size: 0.78rem; }
.bp-table tfoot td, .bp-table tfoot th { font-size: 0.85rem; color: #d7e6f8; }
.bp-table .ok { color: #9fe3b8; }
.bp-table .no { color: #ffc9a0; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button {
  width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid #eef5ff; background: transparent; color: #fff; cursor: pointer; font-size: 1.1rem; line-height: 1;
}
.stepper button:hover { background: rgba(255, 255, 255, 0.12); }
.stepper output { min-width: 1.4em; font-size: 1.25rem; font-weight: 700; font-family: var(--display); }
.bp-scroll { overflow-x: auto; }
.bp-mini { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.bp-mini th, .bp-mini td { border: 1px solid rgba(238, 245, 255, 0.7); padding: 5px 6px; text-align: center; }
.bp-mini tbody th { text-align: left; font-weight: 600; }
.bp-mini td.full { background: rgba(159, 227, 184, 0.22); }
.bp-mini td.over { background: rgba(229, 114, 0, 0.6); }
select[data-refac] { min-width: 160px; }

/* ---------------------------------------------------------------- item cards */
.bank-layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 980px) { .bank-layout { grid-template-columns: minmax(0, 1fr); } }
.bank-side { position: sticky; top: 92px; }
@media (max-width: 980px) { .bank-side { position: static; } }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar input[type="text"] { flex: 1 1 200px; width: auto; }
.seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: var(--r-sm); overflow: hidden; background: #fff; }
.seg button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; min-height: 40px; font-size: 0.9rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.icard {
  background:
    linear-gradient(var(--index-red), var(--index-red)) 0 30px / 100% 1.5px no-repeat,
    repeating-linear-gradient(#fff 0 25px, #dbe7f3 25px 26px) 0 31px / 100% calc(100% - 31px) no-repeat,
    #fff;
  border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 6px 14px 12px; box-shadow: var(--shadow-card);
  display: flex; flex-direction: column; gap: 8px; position: relative; scroll-margin-top: 100px;
}
.icard .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 0.76rem; color: var(--muted); height: 22px; align-items: center; }
.icard .stmt { font-family: var(--serif); font-size: 1.04rem; line-height: 26px; margin: 0; padding-top: 2px; }
.icard.placed { border-left: 6px solid var(--fc, var(--ink)); }
.icard.hl { box-shadow: 0 0 0 3px var(--orange); }
.icard .flags { display: flex; gap: 6px; flex-wrap: wrap; }
.flag { font-size: 0.74rem; border-radius: 3px; padding: 1px 6px; background: var(--warn-bg); color: #6d3c05; border: 1px solid #f2cf9f; cursor: help; }
.place { display: grid; gap: 6px; background: #f6f9fc; border: 1px solid var(--rule); border-radius: var(--r-sm); padding: 8px; }
.place .lab { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1.5px solid var(--rule-strong); background: #fff; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 0.84rem; min-height: 34px; }
.opt[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
.opt.fac[aria-pressed="true"] { background: var(--fc); border-color: var(--fc); }
.opt:disabled { opacity: 0.45; cursor: not-allowed; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 650; color: var(--fc); }
.counter { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.counter div { background: #fff; border: 1px solid var(--rule); border-top: 4px solid var(--fc); border-radius: var(--r-sm); padding: 8px; font-size: 0.82rem; }
.counter b { display: block; font-size: 1.3rem; font-family: var(--display); }

/* map */

  <script>
/*
 * Construct Lab psychometrics engine (no dependencies).
 *
 *   - descriptive item statistics (facility, SD, corrected item-total r)
 *   - internal consistency: Cronbach's alpha, alpha-if-item-deleted,
 *     split-half (odd/even) with Spearman-Brown, average inter-item r
 *   - EGA: EBICglasso network (as in EGAnet::EBICglasso.qgraph: 100 lambdas,
 *     lambda.min.ratio = .1, gamma = .5, unpenalized diagonal) + Walktrap
 *     community detection (port of igraph's cluster_walktrap, steps = 4),
 *     singleton communities set to NA (EGAnet default)
 *   - small utilities: seeded PRNG (mulberry32), FNV-1a hash
 *
 * Works in the browser (window.Engine) and in Node (module.exports).
 * Validated against EGAnet 2.5.0 and psych in tools/validate_engine.R.
 */
(function (root) {
  "use strict";

  // ------------------------------------------------------------ utilities
  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  const mean = (x) => x.reduce((s, v) => s + v, 0) / x.length;
  function variance(x) {
    const m = mean(x);
    let s = 0;
    for (const v of x) s += (v - m) * (v - m);
    return s / (x.length - 1);
  }
  function cor(x, y) {
    const n = x.length, mx = mean(x), my = mean(y);
    let sxy = 0, sxx = 0, syy = 0;
    for (let i = 0; i < n; i++) {
      const a = x[i] - mx, b = y[i] - my;
      sxy += a * b; sxx += a * a; syy += b * b;
    }
    return sxx === 0 || syy === 0 ? NaN : sxy / Math.sqrt(sxx * syy);
  }
  function corMatrix(cols) {
    const p = cols.length, R = [];
    for (let i = 0; i < p; i++) R.push(new Array(p).fill(0));
    for (let i = 0; i < p; i++) {
      R[i][i] = 1;
      for (let j = i + 1; j < p; j++) R[i][j] = R[j][i] = cor(cols[i], cols[j]);
    }
    return R;
  }
  function rowSums(cols, skip) {
    const n = cols[0].length, out = new Array(n).fill(0);
    cols.forEach((c, k) => { if (k !== skip) for (let i = 0; i < n; i++) out[i] += c[i]; });
    return out;
  }

  // ------------------------------------------------------------ reliability
  function alpha(cols) {
    const k = cols.length;
    if (k < 2) return NaN;
    const sumVar = cols.reduce((s, c) => s + variance(c), 0);
    const totVar = variance(rowSums(cols));
    return (k / (k - 1)) * (1 - sumVar / totVar);
  }
  function splitHalf(cols) {
    // odd/even halves in the order given, Spearman-Brown corrected (Rust et al., p. 34)
    if (cols.length < 2) return { r: NaN, sb: NaN };
    const odd = cols.filter((_, i) => i % 2 === 0), even = cols.filter((_, i) => i % 2 === 1);
    const r = cor(rowSums(odd), rowSums(even));
    return { r, sb: (2 * r) / (1 + r) };
  }
  function avgInterItem(R) {
    let s = 0, n = 0;
    for (let i = 0; i < R.length; i++) for (let j = i + 1; j < R.length; j++) { s += R[i][j]; n++; }
    return n ? s / n : NaN;
  }
  function reliability(cols) {
    const R = corMatrix(cols);
    const sh = splitHalf(cols);
    return { k: cols.length, alpha: alpha(cols), splitHalf: sh.r, spearmanBrown: sh.sb, avgR: avgInterItem(R) };
  }
  function itemAnalysis(cols) {
    // per item: facility (mean), SD, corrected item-total r, alpha if deleted
    const total = rowSums(cols);
    return cols.map((c, k) => {
      const rest = total.map((t, i) => t - c[i]);
      const others = cols.filter((_, j) => j !== k);
      return {
        mean: mean(c), sd: Math.sqrt(variance(c)),
        citc: cor(c, rest),
        alphaIfDeleted: others.length >= 2 ? alpha(others) : NaN,
      };
    });
  }

  // ------------------------------------------------------------ glasso
  // Friedman, Hastie & Tibshirani (2008) block coordinate descent, unpenalized diagonal.
  function glasso(S, rho, warm) {
    const p = S.length;
    const W = warm ? warm.W.map((r) => r.slice()) : S.map((r) => r.slice());

  function col(code, sample, k) {
    k = k || (S && S.fmt) || 5;
    const key = sample + "|" + k + "|" + code;
    if (!cache.has(key)) {
      const s = D[sample + "L"][ITEMS[code].idx], ind = D.indecisive[sample], a = new Array(s.length);
      for (let i = 0; i < s.length; i++) a[i] = categorize(s.charCodeAt(i) - 35, k, ind.charCodeAt(i) === 49);
      cache.set(key, a);
    }
    return cache.get(key);
  }
  function facetsOf(t) { return D.traits[t].map((n) => D.facets.indexOf(n)); }
  const fname = (fi) => FACET_INFO[D.facets[fi]].name;
  const FHEX = ["#2a6fb0", "#b9861a", "#2f8f5f", "#7a58b0", "#c94f78", "#23898c"];
  const fcol = (fi) => FHEX[fi];

  function makeBank(id, t) {
    const rnd = E.mulberry32(E.fnv1a(id.trim().toLowerCase() + "|" + t));
    let bank = [];
    facetsOf(t).forEach((fi) => {
      const pool = D.items.filter((it) => it.t === t && it.f === fi).map((it) => it.id).sort();
      const chosen = [];
      const add = (c) => { if (!chosen.includes(c)) chosen.push(c); };
      const twinCands = E.shuffle(pool.filter((c) => ITEMS[c].tw.some((x) => ITEMS[x].f === fi)), rnd);
      if (twinCands.length) {
        const a = twinCands[0];
        const b = ITEMS[a].tw.filter((x) => ITEMS[x].f === fi).sort()[0];
        add(a); add(b);
      }
      E.shuffle(pool.filter((c) => ITEMS[c].amb && !chosen.includes(c)), rnd).slice(0, 3).forEach(add);
      for (const c of E.shuffle(pool.filter((c) => !chosen.includes(c)), rnd)) { if (chosen.length >= 20) break; add(c); }
      bank = bank.concat(chosen);
    });
    return E.shuffle(bank, rnd);
  }

  // ---------------------------------------------------------------- state
  const KEY = "construct-lab-v1";
  let S = null;
  const ui = { open: new Set(), filter: "all", q: "", tab: "net", fieldTab: "net", hl: null, advice: true };
  function blank(name, id) {
    return {
      v: 1, name, id, created: Date.now(), stage: 1, maxStage: 1, stageStart: { 1: Date.now() }, stageTime: {},
      trait: null, purposeKind: null, purpose: "", fmt: null, arith: { tries: 0, firstOk: null, ok: false, pilot: "", per: "" },
      plan: null, bank: [], placed: {}, order: [], face: {}, revealed: false, revealSnap: null,
      pilot: { runs: [], current: null, cuts: [] }, final: null, field: null, answers: {}, refl: ["", ""], mcqOrder: null, done: false,
    };

  function save() { try { localStorage.setItem(KEY + ":" + S.id, JSON.stringify(S)); localStorage.setItem(KEY + ":last", S.id); } catch (e) { /* storage unavailable: continue in memory */ } }

  // ---------------------------------------------------------------- analysis
  function analyze(codes, sample) {
    const facs = facetsOf(S.trait);
    const fOf = (c) => S.placed[c].f;
    const cols = codes.map((c) => col(c, sample));
    const out = { codes, sample, facets: {}, items: {}, total: E.reliability(cols) };
    facs.forEach((fi) => {
      const fc = codes.filter((c) => fOf(c) === fi);
      const fcols = fc.map((c) => col(c, sample));
      out.facets[fi] = fc.length >= 2 ? E.reliability(fcols) : { k: fc.length, alpha: NaN, spearmanBrown: NaN, avgR: NaN, splitHalf: NaN };
      const ia = fc.length >= 2 ? E.itemAnalysis(fcols) : fc.map(() => ({ mean: NaN, sd: NaN, citc: NaN, alphaIfDeleted: NaN }));
      fc.forEach((c, k) => { out.items[c] = ia[k]; });
    });
    const g = E.ega(cols);
    out.ega = g;
    out.match = E.structuralMatch(g.wc, codes.map(fOf));
    // redundancy: r >= .60 with another item of the form
    codes.forEach((c, i) => {
      const it = out.items[c];
      it.mean = E.mean(cols[i]); it.sd = Math.sqrt(E.variance(cols[i]));
      it.wc = g.wc[i]; it.fit = out.match.fit[i];
      it.redund = codes.filter((d, j) => j !== i && g.R[i][j] >= 0.6);
    });
    return out;
  }
  const memo = new Map();
  function analysisFor(codes, sample) {
    const key = sample + "|" + S.fmt + "|" + codes.map((c) => c + S.placed[c].f).join(",");
    if (!memo.has(key)) memo.set(key, analyze(codes, sample));
    return memo.get(key);
  }

  function kappa(a, b, cats) {
    const n = a.length; if (!n) return { po: NaN, k: NaN };
    let agree = 0; const pa = {}, pb = {};
    a.forEach((x, i) => { if (x === b[i]) agree++; pa[x] = (pa[x] || 0) + 1; pb[b[i]] = (pb[b[i]] || 0) + 1; });
    const po = agree / n;
    const pe = cats.reduce((s, c) => s + ((pa[c] || 0) / n) * ((pb[c] || 0) / n), 0);
    return { po, k: pe === 1 ? 1 : (po - pe) / (1 - pe) };
  }

  // ---------------------------------------------------------------- scoring (mirrored in tools/grade_exit_tickets.py)
  function score() {
    const parts = [];
    const add = (key, label, pts, max, detail) => parts.push({ key, label, pts, max, detail });
    const facs = S.trait ? facetsOf(S.trait) : [];
    // A. specification
    let a = 0;
    if (S.trait && words(S.purpose) >= 8 && S.purposeKind && S.fmt) a += 0.5;
    if (S.arith.ok) a += S.arith.firstOk ? 0.5 : 0.25;
    if (planValid()) a += 0.5;
    add("spec", "Test specification", a, 1.5, "purpose, construct, and response format; pilot-size arithmetic (first try earns full credit); blueprint rows valid");
    // B. pilot form
    const form = S.pilot.runs.length ? S.pilot.runs[0].codes : Object.keys(S.placed);
    const formOk = form.length >= 15 && facs.every((fi) => form.filter((c) => S.placed[c] && S.placed[c].f === fi).length >= 5) && form.every((c) => S.placed[c] && S.placed[c].m);
    add("form", "Pilot form built from the blueprint", formOk ? 1 : 0, 1, `${form.length}-item pilot form, at least 5 per facet, each with a facet and a manifestation`);
    // C. face & content
    let c = 0;
    const formNow = S.pilot.runs.length ? S.pilot.runs[0].codes : Object.keys(S.placed);
    if (formNow.length && formNow.every((x) => S.face[x])) c += 0.5;
    if (S.revealed) c += 0.5;
    const agreeN = formNow.filter((x) => S.placed[x] && S.placed[x].f === ITEMS[x].f).length;
    if (S.pilot.runs.length && agreeN >= Math.ceil(formNow.length * 0.83)) c += 0.5;
    add("validity", "Face and content validity review", c, 1.5, `face review complete; evidence revealed; ${agreeN}/${formNow.length} placements match the item writer's facet when the pilot ran`);
    // D. pilot & revision
    let d = 0;
    if (S.pilot.runs.length >= 1) d += 0.5;
    if (S.pilot.runs.length >= 2) d += 0.5;
    if (S.final && S.final.length === 12 && facs.every((fi) => S.final.filter((x) => S.placed[x].f === fi).length === FINAL_PER_FACET)) d += 0.5;
    add("pilot", "Pilot analysis and revision", d, 1.5, `${S.pilot.runs.length} pilot run(s); final form of 12 items, 4 per facet`);
    // E. field quality
    let e = 0, det = "field test not run";
    if (S.field) {
      const F = S.field;
      if (F.total.alpha >= 0.8) e += 0.5;
      if (facs.every((fi) => F.facets[fi].alpha >= 0.7)) e += 0.5;
      if (F.nDim === 3 && F.nFit >= 10) e += 0.5;
      det = `field α total ${f2(F.total.alpha)} (≥ .80); every facet α ≥ .70; EGA: ${F.nDim} communities, ${F.nFit}/12 items in their facet's community`;
    }
    add("quality", "Final scale on new respondents", e, 1.5, det);
    // F. concept checks
    let q = 0;
    MCQ.forEach((m) => { const opt = m.o.find((o) => o[0] === S.answers[m.id]); if (opt && opt[2]) q += 0.5; });
    add("checks", "Concept checks", q, 2, "4 questions × 0.5");
    // G. reflection
    const r = S.refl.filter((t) => words(t) >= MIN_WORDS).length * 0.5;
    add("reflect", "Reflection", r, 1, `2 answers of at least ${MIN_WORDS} words`);
    const total = Math.round(parts.reduce((s, p) => s + p.pts, 0) * 100) / 100;
    return { parts, total, max: 10 };
  }

  function relTable(an, facs, labelTotal) {

  function combos(arr, k) {
    const out = [], pick = [];
    (function rec(i) {
      if (pick.length === k) { out.push(pick.slice()); return; }
      for (let j = i; j < arr.length; j++) { pick.push(arr[j]); rec(j + 1); pick.pop(); }
    })(0);
    return out;
  }
  function suggestCuts(an, facs) {

      const fa = an.facets[fi].alpha;
      const reasons = (c) => {
        const it = an.items[c], why = [];
        if (!it.fit) why.push("sits outside its facet's own community");
        const twin = it.redund.filter((d) => fc.includes(d));
        if (twin.length) why.push(`near-copy of ${twin.join(", ")}`);
        if (it.citc < 0.2) why.push("discrimination below Rust's .20");
        else if (it.citc < 0.3) why.push("weak discrimination (below .30)");
        const pos = (it.mean - 1) / (S.fmt - 1);
        if (pos >= 0.8) why.push("near the ceiling"); else if (pos <= 0.2) why.push("near the floor");
        if (it.alphaIfDeleted > fa + 0.005) why.push("α rises without it");
        return why;
      };
      let best = { keep: fc.slice(), score: -Infinity, alpha: fa };
      if (fc.length > FINAL_PER_FACET && fc.length <= 12) {
        for (const keep of combos(fc, FINAL_PER_FACET)) {
          const a = E.alpha(keep.map((c) => col(c, "pilot")));
          const outside = keep.filter((c) => !an.items[c].fit).length;
          const twins = keep.some((c) => an.items[c].redund.some((d) => keep.includes(d)));
          const kinds = new Set(keep.map((c) => S.placed[c].m)).size;
          // small penalties for keeping flagged items break near-ties in favor of the tips
          const flagged = keep.reduce((n, c) => {
            const it = an.items[c], pos = (it.mean - 1) / (S.fmt - 1);
            return n + (it.citc < 0.3 ? 1 : 0) + (pos >= 0.8 || pos <= 0.2 ? 1 : 0) + (it.alphaIfDeleted > fa + 0.005 ? 1 : 0);
          }, 0);
          const score = a - 0.5 * outside - 0.3 * (twins ? 1 : 0) - 0.3 * (kinds < 2 ? 1 : 0) - 0.015 * flagged;
          if (score > best.score) best = { keep, score, alpha: a };
        }
      }
      const keepSet = new Set(best.keep);
      const ranked = fc.slice().sort((a, b) => (keepSet.has(a) - keepSet.has(b)) || an.items[a].citc - an.items[b].citc);
      ranked.forEach((c, rank) => {
        const cut = !keepSet.has(c);
        const why = cut ? reasons(c) : [];
        if (cut) why.push(why.length ? `the four kept give α = ${f2(best.alpha)}` : `no flag, but the best set of four leaves it out (α = ${f2(best.alpha)} with the four kept)`);

    const anchors = facs.map((_, k) => [W / 2 + 150 * Math.cos((2 * Math.PI * k) / 3 - Math.PI / 2), H / 2 + 140 * Math.sin((2 * Math.PI * k) / 3 - Math.PI / 2)]);
    const pos = codes.map((c) => { const a = anchors[facs.indexOf(groupOf(c))] || [W / 2, H / 2]; return [a[0] + (rnd() - 0.5) * 80, a[1] + (rnd() - 0.5) * 80]; });
    const k = Math.sqrt((W * H) / n) * 0.55;
    for (let it = 0; it < 400; it++) {
      const disp = pos.map(() => [0, 0]), temp = 30 * (1 - it / 400) + 0.5;
      for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
        let dx = pos[i][0] - pos[j][0], dy = pos[i][1] - pos[j][1];
        const d = Math.max(0.01, Math.hypot(dx, dy));
        const rep = (k * k) / d;
        const w = Math.abs(net[i][j]);
        const att = w > 0 ? (d * d / k) * (0.6 + 5 * w) : 0;

  function hull(points) {
    const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);

    const lo = [], up = [];
    for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
    for (const q of p.slice().reverse()) { while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }

        <h2>1 · Test specification</h2>
        <div class="two"><div><p><b>Construct:</b> ${TRAIT_INFO[t.trait].name}<br><b>Use:</b> ${PURPOSES[t.purposeKind].t} (${esc(PURPOSES[t.purposeKind].d)})<br><b>Response format:</b> ${fmtName(t.fmt)}: ${FORMATS[t.fmt].labels.join(" · ")}<br><b>Purpose statement:</b> ${esc(t.purpose)}</p></div>
          <div><table><thead><tr><th>Blueprint (pilot)</th>${ABCD.map((a) => `<th class="num">${a.k}</th>`).join("")}<th class="num">Σ</th></tr></thead><tbody>${facs.map((fi, k) => `<tr><td>${fname(fi)}</td>${t.plan[k].map((v) => `<td class="num">${v}</td>`).join("")}<td class="num">${t.plan[k].reduce((a, b) => a + b, 0)}</td></tr>`).join("")}</tbody></table></div></div>

        <h2>2 · Face and content validity</h2>
        <p>Face review: ${t.face.rated} of ${t.form.length} items judged; ${t.face.problems.length} flagged as problems${t.face.problems.length ? ` (${t.face.problems.map(([c, r]) => `${c}: ${(REASONS.find((x) => x[0] === r) || ["", r])[1].toLowerCase()}`).join("; ")})` : ""}.
        ${(() => { const g = t.final.filter(([c]) => ITEMS[c].fl.includes("grammar")).map(([c]) => c); return g.length ? `Your final scale still contains ${g.length} item(s) with a grammar flag (${g.join(", ")}); a respondent would notice. ` : "No item on your final scale carries a grammar flag. "; })()}
        Content review: your facet matched the item writer's on ${t.content.facetAgree} of ${t.content.n} items; ABCD agreement with Rater 2 ${Math.round(t.content.abcdAgree * 100)}% (Cohen's κ = ${f2(t.content.abcdKappa)}).</p>

        <h2>3 · Pilot runs (N = 300)</h2>
        <table><thead><tr><th>Run</th><th class="num">Items</th><th class="num">Options</th><th class="num">Total α</th><th class="num">EGA communities</th><th class="num">Items in their facet's community</th></tr></thead><tbody>${t.runs.map((r, i) => `<tr><td>${i + 1}</td><td class="num">${r.k}</td><td class="num">${r.fmt || 5}</td><td class="num">${f2(r.alpha)}</td><td class="num">${r.nDim}</td><td class="num">${r.nFit} / ${r.k}</td></tr>`).join("")}</tbody></table>

        <h2>4 · Final scale (12 items)</h2>
        <table><thead><tr><th>#</th><th>Item</th><th>Facet</th><th>ABCD</th></tr></thead><tbody>${t.final.map(([c, f, m], i) => `<tr><td>${i + 1}</td><td><span class="muted">${c}</span> ${esc(ITEMS[c].s)}</td><td>${fname(f)}</td><td>${m}</td></tr>`).join("")}</tbody></table>

        <h2>5 · Internal reliability: pilot vs field test</h2>
        <table><thead><tr><th>Scale</th><th class="num">Items</th><th class="num">α pilot</th><th class="num">α field</th><th class="num">Spearman–Brown split-half (field)</th><th class="num">Mean inter-item r (field)</th></tr></thead>
          <tbody>${relRows.map(([lab, p, f]) => `<tr><td>${lab}</td><td class="num">${f.k}</td><td class="num">${f2(p.alpha)}</td><td class="num"><b>${f2(f.alpha)}</b></td><td class="num">${f2(f.sb)}</td><td class="num">${f2(f.avgR)}</td></tr>`).join("")}</tbody></table>
        <p>EGA on the field sample: <b>${t.field.nDim}</b> communities; <b>${t.field.nFit} of 12</b> items in their facet's community.</p>

        <h2>6 · Concept checks</h2>
        <table><tbody>${MCQ.map((m, i) => { const o = m.o.find((x) => x[0] === t.answers[m.id]); return `<tr><td>${i + 1}. ${esc(m.q)}</td><td style="width:42%">${esc(o ? o[1] : "–")}</td><td class="num" style="width:56px">${o && o[2] ? "✓ 0.5" : "✗ 0"}</td></tr>`; }).join("")}</tbody></table>

        <h2>7 · Reflection</h2>
        ${REFLECT.map((q, i) => `<p><b>${i + 1}. ${esc(q)}</b></p><div class="refl">${esc(t.refl[i])}</div>`).join("")}

        <h2>Key ideas from this lab</h2>
        <div class="defs">
          <div class="box"><h3>Test specification</h3>A grid of content areas × manifestations that fixes how many items each cell gets before any item is written (Rust et al., 2020, pp. 20–22).</div>
          <div class="box"><h3>Face vs content validity</h3>Face: will respondents and users accept the items for this purpose? Content: do the items cover the blueprint, and only the blueprint? Both are judgments, made before data (p. 43).</div>
          <div class="box"><h3>Internal reliability</h3>Cronbach's α = k/(k−1) × (1 − Σ item variances / total variance). Split-half: correlate two half-scores and correct with r<sub>SB</sub> = 2r/(1+r). Aim for ≥ .70 on person-based scales.</div>
          <div class="box"><h3>Structural validity (EGA)</h3>A partial-correlation network (glasso + EBIC) whose Walktrap communities estimate the dimensions. Items should sit with their own facet (Golino & Epskamp, 2017).</div>
        </div>
        <div class="verify"><span>Verification code: <b>${code}</b></span><span>Construct Lab v${APP_VERSION} · data ${esc(t.dataVersion)}</span></div>
        <div class="machine"><span class="mk">BEGIN-CONSTRUCT-LAB-TICKET</span> ${b64(json)} ${code} <span class="mk">END-CONSTRUCT-LAB-TICKET</span></div>
      </article>`;
  }
  function ticketText() {
    const t = S.ticket, json = JSON.stringify(t), code = ticketCode(json);
    const facs = facetsOf(S.trait), parts = score().parts;
    const L = [];
    L.push("CONSTRUCT LAB · EXIT TICKET", "Research Methods & Data Analysis I · University of Virginia", "".padEnd(60, "="));
    L.push(`Name: ${t.name}`, `Computing ID: ${t.id}`, `Created: ${t.createdAt}`, `Time in lab: ${t.minutes} min`, "");
    L.push(`SCORE: ${t.score.total} / 10`);
    parts.forEach((p) => L.push(`  ${String(p.pts).padStart(4)} / ${p.max}  ${p.label}`));
    L.push("", "HOW TO SUBMIT: upload this file to the Canvas assignment 'Construct Lab: Exit Ticket'.", "");
    L.push(`Construct: ${TRAIT_INFO[t.trait].name}   Use: ${PURPOSES[t.purposeKind].t}   Response format: ${fmtName(t.fmt)}`, `Purpose: ${t.purpose}`, "");
    L.push("FINAL SCALE");
    t.final.forEach(([c, f, m], i) => L.push(`  ${String(i + 1).padStart(2)}. [${fname(f)} / ${m}] ${ITEMS[c].s} (${c})`));
    L.push("", "INTERNAL RELIABILITY (alpha pilot -> field; field split-half SB; field mean r)");
    facs.forEach((fi) => { const p = t.pilotFinal[D.facets[fi]], f = t.field[D.facets[fi]]; L.push(`  ${fname(fi).padEnd(22)} ${f2(p.alpha)} -> ${f2(f.alpha)}   SB ${f2(f.sb)}   r ${f2(f.avgR)}`); });
    L.push(`  ${"Total scale".padEnd(22)} ${f2(t.pilotFinal.total.alpha)} -> ${f2(t.field.total.alpha)}   SB ${f2(t.field.total.sb)}   r ${f2(t.field.total.avgR)}`);
    L.push(`  EGA (field): ${t.field.nDim} communities; ${t.field.nFit}/12 items in their facet's community`, "");
    L.push("REFLECTION");
    REFLECT.forEach((q, i) => L.push(`  ${i + 1}. ${q}`, `     ${t.refl[i].replace(/\s+/g, " ")}`, ""));
    L.push(`Verification code: ${code}`, "", `BEGIN-CONSTRUCT-LAB-TICKET ${b64(json)} ${code} END-CONSTRUCT-LAB-TICKET`, "");
    return L.join("\n");
  }

  // ---------------------------------------------------------------- crowd animation
  function crowd(then) {
    const cells = $$("#crowd i");
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!cells.length || reduce) { then(); return; }
    let i = 0;
    const step = () => { for (let k = 0; k < 18 && i < cells.length; k++, i++) cells[i].classList.add("on"); if (i < cells.length) requestAnimationFrame(step); else setTimeout(then, 180); };
    step();
  }

  // ---------------------------------------------------------------- events
  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button, [data-go]");
    if (!t || !S) return;
    const d = t.dataset;
    if (d.go) { go(+d.go); return; }
    if (d.plan) {
      const [fi, m, dv] = d.plan.split(",").map(Number);
      const row = S.plan[fi], sum = row.reduce((a, b) => a + b, 0);
      if (dv > 0 && sum >= PILOT_PER_FACET) { toast(`${fname(fi)} already has ${PILOT_PER_FACET} items. Take one from another cell first.`); return; }
      row[m] = Math.max(0, row[m] + dv); save(); render(); return;
    }
    if (d.open) { ui.open.add(d.open); render(); return; }
    if (d.fac) {
      const [c, fi] = d.fac.split(","); const f = +fi;
      if (!S.placed[c]) { S.placed[c] = { f, m: null }; S.order.push(c); delete S.face[c]; }
      else S.placed[c].f = f;
      save(); render(); const el = $(`#card-${c}`); el && el.querySelector("[data-man]") && el.querySelector("[data-man]").focus(); return;
    }
    if (d.man) { const [c, m] = d.man.split(","); if (S.placed[c]) { S.placed[c].m = m; ui.open.delete(c); save(); render(); const el = $(`#card-${c}`); el && el.querySelector("button") && el.querySelector("button").focus(); } return; }
    if (d.unplace) { const c = d.unplace; delete S.placed[c]; S.order = S.order.filter((x) => x !== c); ui.open.delete(c); delete S.face[c]; save(); render(); return; }
    if (d.filter) { ui.filter = d.filter; render(); return; }
    if (d.face) {
      const [c, v] = d.face.split(",");
      S.face[c] = v === "ok" ? { ok: true } : { ok: false, reason: (S.face[c] && S.face[c].reason) || "" };
      save(); render(); return;
    }
    if (d.drop) {
      const c = d.drop; delete S.placed[c]; S.order = S.order.filter((x) => x !== c); delete S.face[c]; save(); render();
      toast(`${c} removed. Add a replacement from the item bank (Stage 2).`); return;
    }
    if (d.fmt) { setFormat(+d.fmt, d.where); return; }
    if (d.bringback) {
      const c = d.bringback, cur = new Set(S.pilot.current); cur.add(c);
      S.pilot.current = formCodes().filter((x) => cur.has(x));
      const y = window.scrollY; recordRun(S.pilot.current); save(); render(); window.scrollTo(0, y);
      toast(`${c} is back on the form. The analysis was re-run.`); return;
    }
    if (d.tab) { ui.tab = d.tab; render(); return; }
    if (d.ftab) { ui.fieldTab = d.ftab; render(); return; }
    switch (d.act) {
      case "signout": S = null; openDefs(false); render(); return;
      case "defs": openDefs(!ui.defs); return;
      case "defs-close": openDefs(false); return;
      case "check-arith": {
        const a = $("#a-pilot").value.trim(), b = $("#a-per").value.trim();
        if (!/^\d+(\.\d+)?$/.test(a) || !/^\d+(\.\d+)?$/.test(b)) {
          S.arith.pilot = a; S.arith.per = b;
          $("#arith-fb").innerHTML = `<div class="feedback note">Enter a number in both boxes, then press Check. (This did not count as an attempt.)</div>`;
          $(a ? "#a-per" : "#a-pilot").focus(); return;
        }
        S.arith.pilot = a; S.arith.per = b; S.arith.tries++;
        const ok = +a === 18 && +b === 6;
        if (S.arith.firstOk === null) S.arith.firstOk = ok;
        S.arith.ok = ok; save(); render(); return;
      }
      case "to-bank": if (!S.bank.length) S.bank = makeBank(S.id, S.trait); go(2); return;
      case "to-validity": go(3); return;
      case "reveal": S.revealed = true; save(); render(); return;
      case "to-pilot":
        if (!S.pilot.runs.length) S.pilot.current = formCodes();
        else {
          // the form changed after a pilot run: start the pilot over with the new form
          const cur = formCodes();
          if (cur.join() !== S.pilot.runs[0].codes.join()) { S.pilot = { runs: [], current: cur, cuts: [] }; S.final = null; S.field = null; }
        }
        go(4); return;
      case "run-pilot": t.disabled = true; crowd(() => { recordRun(S.pilot.current); save(); render(); }); return;
      case "rerun": {
        S.pilot.current = S.pilot.current.filter((c) => !S.pilot.cuts.includes(c)); S.pilot.cuts = [];
        recordRun(S.pilot.current); save(); render(); toast("Re-run complete."); return;
      }
      case "clear-cuts": S.pilot.cuts = []; save(); render(); return;
      case "restore": S.pilot.current = formCodes(); S.pilot.cuts = []; recordRun(S.pilot.current); save(); render(); toast("All cut items are back. The analysis was re-run."); return;
      case "lock": {
        const keep = S.pilot.current.filter((c) => !S.pilot.cuts.includes(c));
        if (keep.length !== S.pilot.current.length) { S.pilot.current = keep; S.pilot.cuts = []; recordRun(keep); }
        S.final = keep.slice(); S.field = null; save(); go(5); return;
      }
      case "run-field": t.disabled = true; crowd(() => { computeField(); save(); render(); }); return;
      case "to-ticket": go(6); return;
      case "make-ticket": S.done = true; S.ticket = ticketPayload(); save(); render(); return;
      case "unlock": S.done = false; save(); render(); return;
      case "print": { const old = document.title; document.title = `ExitTicket_${S.id}`; window.print(); setTimeout(() => { document.title = old; }, 1000); return; }
      case "txt": {
        const blob = new Blob([ticketText()], { type: "text/plain" });
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `ExitTicket_${S.id}.txt`;
        document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); return;
      }
    }
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target; if (!S) return;
    if (t.dataset.reason) { S.face[t.dataset.reason] = { ok: false, reason: t.value }; save(); render(); return; }
    if (t.dataset.refac) { S.placed[t.dataset.refac].f = +t.value; save(); render(); return; }
    if (t.dataset.advice !== undefined) { ui.advice = t.checked; const y = window.scrollY; render(); window.scrollTo(0, y); return; }
    if (t.dataset.cut) {
      const c = t.dataset.cut;
      S.pilot.cuts = t.checked ? S.pilot.cuts.concat(c) : S.pilot.cuts.filter((x) => x !== c);
      save(); const y = window.scrollY; render(); window.scrollTo(0, y); return;
    }
    if (t.type === "radio" && MCQ.some((m) => m.id === t.name)) { S.answers[t.name] = t.value; save(); return; }
  });
  document.addEventListener("input", (ev) => {
    const t = ev.target; if (!S) return;
    if (t.dataset.refl != null) {
      S.refl[+t.dataset.refl] = t.value; $("#wc" + t.dataset.refl).textContent = words(t.value); save();
      const btn = $('[data-act="make-ticket"]');
      if (btn) btn.disabled = !(MCQ.every((m) => S.answers[m.id]) && S.refl.every((x) => words(x) >= MIN_WORDS));
    }
  });
  document.addEventListener("change", (ev) => {
    if (ev.target.type === "radio" && S && S.stage === 6) {
      const btn = $('[data-act="make-ticket"]');
      if (btn) btn.disabled = !(MCQ.every((m) => S.answers[m.id]) && S.refl.every((x) => words(x) >= MIN_WORDS));
    }
  });
  window.addEventListener("beforeunload", () => { if (S) { const now = Date.now(); S.stageTime[S.stage] = (S.stageTime[S.stage] || 0) + (now - (S.stageStart[S.stage] || now)); S.stageStart[S.stage] = now; save(); } });

  // expose for tests and the instructor tools
  window.ConstructLab = { makeBank, col: (c, s, k) => col(c, s, k), categorize, score: () => S && score(), state: () => S, ticketText: () => S && S.ticket && ticketText(), version: APP_VERSION };
  render();
})();

</script>
  </body>
</html>
